<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHELFHOS | Branding Tech & Menús Digitales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #05070a;
    --card-bg: rgba(14, 17, 23, 0.75);
    --border-subtle: rgba(212, 175, 55, 0.18);
    --border-hover: rgba(212, 175, 55, 0.45);
    --gold: #d4af37;
    --gold-light: #f3e5ab;
    --gold-grad: linear-gradient(135deg, #d4af37 0%, #aa771c 100%);
    --silver-grad: linear-gradient(135deg, #e0e0e0 0%, #8a8a8a 100%);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  
  body {
    background: radial-gradient(circle at 50% 0%, #111827 0%, var(--bg-deep) 75%);
    color: var(--text-primary);
    font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    max-width: 540px;
    margin: 0 auto;
    padding-bottom: calc(85px + env(safe-area-inset-bottom));
  }

  a { color:inherit; text-decoration:none; }

  /* Topbar Minimalista */
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 24px;
  }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--card-bg); border: 1px solid var(--border-subtle);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold-light); font-size: 1rem;
    backdrop-filter: blur(12px);
  }

  /* Hero Corporativo */
  .hero-section {
    text-align: center;
    padding: 20px 24px 30px;
  }
  .hero-logo-box {
    width: 220px;
    margin: 0 auto 20px;
    position: relative;
    border-radius: 20px;
    padding: 10px;
    background: radial-gradient(circle, rgba(212,175,55,0.08) 0%, transparent 70%);
  }
  .hero-logo-box img {
    width: 100%; height: auto; display: block;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.6));
  }
  .hero-tagline {
    font-size: 0.75rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .hero-title {
    font-family: 'Cinzel', serif;
    font-size: 2.3rem;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(180deg, #ffffff 30%, #cbd5e1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
  }
  .hero-subtitle {
    font-size: 0.95rem;
    color: #e2e8f0;
    font-weight: 400;
    margin: 10px auto 16px;
    letter-spacing: 0.5px;
  }
  .hero-desc {
    color: var(--text-muted);
    font-size: 0.85rem;
    max-width: 430px;
    margin: 0 auto 26px;
    font-weight: 300;
  }
  .hero-actions {
    display: flex; justify-content: center; gap: 14px;
  }
  .btn-gold {
    background: var(--gold-grad);
    color: #000;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.85rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 15px rgba(212,175,55,0.25);
  }
  .btn-outline {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 0.85rem;
    backdrop-filter: blur(10px);
  }

  /* Secciones Generales */
  section { padding: 34px 24px 0; }
  .section-head { margin-bottom: 20px; }
  .section-title {
    font-family: 'Cinzel', serif;
    font-size: 1.25rem;
    letter-spacing: 1.5px;
    color: #fff;
    text-transform: uppercase;
  }
  .gold-divider {
    width: 35px; height: 2px; background: var(--gold); margin-top: 6px;
  }

  /* Tarjeta de Planes y Tabla */
  .plans-wrapper {
    background: var(--card-bg);
    border: 1px solid var(--border-subtle);
    border-radius: 14px;
    padding: 12px;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    margin-bottom: 20px;
  }
  .plans-wrapper img {
    width: 100%; height: auto; border-radius: 8px; display: block;
  }

  /* Demos Corporativas */
  .demo-group { display: flex; flex-direction: column; gap: 12px; }
